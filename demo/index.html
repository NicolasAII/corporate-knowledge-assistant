<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Assistant Demo</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #6b7482;
      --border: #dfe3e8; --accent: #2f6fde; --ok: #1f8a4c; --ok-bg: #e5f5ec;
      --err: #b4372f; --err-bg: #fbe9e7; --chip: #eef2f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0;
        --border: #313743; --accent: #6b9cf5; --ok: #5cc98a; --ok-bg: #1d3327;
        --err: #f08a80; --err-bg: #3a2220; --chip: #262c36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 4px 0 24px; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    input[type=file] { flex: 1; min-width: 0; color: var(--muted); }
    button.primary {
      padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 8px; cursor: pointer;
    }
    button.primary:disabled { opacity: .5; cursor: wait; }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    #ingest-log { list-style: none; padding: 0; margin: 12px 0 0; font-size: 14px; }
    #ingest-log li { padding: 2px 0; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.err { background: var(--err-bg); color: var(--err); }
    #samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
    .group-label { width: 100%; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 6px; }
    .chip {
      font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 99px; cursor: pointer;
      background: var(--chip); color: var(--text); border: 1px solid var(--border);
    }
    .chip:hover { border-color: var(--accent); }
    .answer { margin-top: 16px; padding: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
    .answer.refused { border-color: var(--err); }
    .answer.error { border-color: var(--err); color: var(--err); }
    .answer-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .q { font-weight: 600; margin: 0; flex: 1; min-width: 200px; }
    .muted { color: var(--muted); font-size: 13px; }
    .body p { margin: 8px 0; }
    .body ul { margin: 8px 0; padding-left: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    @media (max-width: 560px) { th:nth-child(3), td:nth-child(3) { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Corporate Knowledge Assistant</h1>
      <span id="health" class="badge">checking…</span>
    </header>
    <p class="sub">Ask questions about internal company policies. Answers come only from the uploaded documents.</p>

    <section>
      <h2>1. Upload policy documents</h2>
      <div class="row">
        <input id="file" type="file" accept=".pdf,.txt,.md" multiple>
        <button id="upload" class="primary" type="button">Upload</button>
      </div>
      <p class="hint">Samples are in <code>data/samples/</code>. Re-uploading a file replaces its old chunks.</p>
      <ul id="ingest-log"></ul>
    </section>

    <section>
      <h2>2. Ask a question</h2>
      <form id="chat-form" class="row">
        <input id="question" type="text" placeholder="Berapa hari jatah cuti tahunan saya?" autocomplete="off">
        <button id="ask" class="primary" type="submit">Ask</button>
      </form>
      <div id="samples"></div>
      <div id="answer" class="answer" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
